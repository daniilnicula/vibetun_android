name: Android APK

on:
  push:
    branches:
      - "arena/03ebb552-goreboxandroid"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build sing-box core and APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android build packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;26.2.11394342"

      - name: Set up Go 1.25 for AmneziaWG
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.0"
          cache: true
          cache-dependency-path: core/amneziawg-android/go.sum

      - name: Build AmneziaWG Android runtime
        shell: bash
        run: |
          set +e
          ./scripts/build-amneziawg-android.sh 2>&1 | tee /tmp/amneziawg-build.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            echo "::group::Last AmneziaWG build output"
            tail -n 100 /tmp/amneziawg-build.log | while IFS= read -r line; do
              escaped=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g')
              echo "::error::$escaped"
            done
            echo "::endgroup::"
            exit "$result"
          fi

      - name: Set up Go 1.23 for sing-box
        uses: actions/setup-go@v7
        with:
          go-version: "1.23.9"
          cache: true
          cache-dependency-path: core/sing-box/go.sum

      - name: Cache native sing-box AAR
        uses: actions/cache@v5
        with:
          path: app/libs/libbox.aar
          key: libbox-${{ runner.os }}-go1.23.9-${{ hashFiles('core/sing-box/**/*.go', 'core/sing-box/go.mod', 'core/sing-box/go.sum', 'core/sing-quic/**/*.go', 'core/sing-quic/go.mod', 'core/sing-quic/go.sum') }}

      - name: Build sing-box libbox.aar
        shell: bash
        run: |
          if [ -s app/libs/libbox.aar ]; then
            echo "Using the restored sing-box AAR cache."
            exit 0
          fi
          set +e
          ./scripts/build-libbox-android.sh 2>&1 | tee /tmp/libbox-build.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            echo "::group::Last libbox build output"
            tail -n 80 /tmp/libbox-build.log | while IFS= read -r line; do
              escaped=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g')
              echo "::error::$escaped"
            done
            echo "::endgroup::"
            exit "$result"
          fi

      - name: Run Android unit tests and assemble APK
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee /tmp/gradle-build.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            RESULT="$result" python3 - <<'PY'
          from pathlib import Path
          import os
          log_paths = [Path('/tmp/gradle-build.log')]
          daemon_dir = Path.home() / '.gradle' / 'daemon'
          if daemon_dir.exists():
              log_paths.extend(sorted(daemon_dir.glob('**/*.out.log'), key=lambda p: p.stat().st_mtime, reverse=True)[:2])
          chunks = [f'Gradle exit code: {os.environ.get("RESULT", "non-zero")}']
          for path in log_paths:
              if path.exists():
                  chunks.append(f'--- {path} ---\n' + '\n'.join(path.read_text(errors='replace').splitlines()[-100:]))
          for path in Path('app/build/test-results/testDebugUnitTest').glob('*.xml'):
              chunks.append(f'--- {path} ---\n' + path.read_text(errors='replace')[-12000:])
          text = '\n'.join(chunks).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Gradle and daemon logs::{text}')
          PY
            exit "$result"
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GoreBox-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Keep a downloadable APK archive on the work branch
        if: github.ref == 'refs/heads/arena/03ebb552-goreboxandroid'
        run: |
          mkdir -p deliverables
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile
          apk = Path('app/build/outputs/apk/debug/app-debug.apk')
          archive = Path('deliverables/GoreBox-debug-apk.zip')
          with ZipFile(archive, 'w', compression=ZIP_DEFLATED, compresslevel=9) as output:
              output.write(apk, arcname='GoreBox-debug.apk')
          size = archive.stat().st_size
          print(f'Compressed APK archive: {size} bytes')
          if size >= 100_000_000:
              raise SystemExit('Compressed APK archive exceeds GitHub\'s 100 MB file limit.')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deliverables/GoreBox-debug-apk.zip
          if git diff --cached --quiet; then
            echo "The branch already contains the current APK archive."
          else
            git commit -m "Add compressed downloadable GoreBox debug APK"
            git push origin HEAD:refs/heads/arena/03ebb552-goreboxandroid
          fi
