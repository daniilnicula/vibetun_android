name: Android debug APK

permissions:
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK command-line tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fLsS --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/cmdline-tools.zip"
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;26.2.11394342'
      - uses: actions/cache@v4
        id: native-cache
        with:
          path: |
            app/libs/libbox.aar
            app/src/main/jniLibs
          key: android-native-${{ hashFiles('core/**', 'scripts/build-*-android.sh') }}
      - uses: actions/setup-go@v5
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          go-version: '1.25.x'
          cache: false
      - name: Build AmneziaWG runtime
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: bash ./scripts/build-amneziawg-android.sh
      - uses: actions/setup-go@v5
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          go-version: '1.23.x'
          cache: false
      - name: Build libbox AAR
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: bash ./scripts/build-libbox-android.sh
      - name: Version from release tag
        run: |
          # Тег 26.10.15v5 -> versionCode 261015005 ((YY*100+MM)*100+DD)*1000+N, монотонно растёт,
          # влезает в int), versionName = сам тег. Сборки ветки без тега — dev-версия по номеру прогона.
          CODE="$GITHUB_RUN_NUMBER"
          NAME="0.1.0-dev.$GITHUB_RUN_NUMBER"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ "$TAG" =~ ^([0-9]{2})\.([0-9]{2})\.([0-9]{2})v([0-9]{1,3})$ ]]; then
              CODE=$(( ((10#${BASH_REMATCH[1]} * 100 + 10#${BASH_REMATCH[2]}) * 100 + 10#${BASH_REMATCH[3]}) * 1000 + 10#${BASH_REMATCH[4]} ))
              NAME="$TAG"
            fi
          fi
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "versionCode=$CODE versionName=$NAME"
      - name: Assemble debug APK
        run: |
          if bash ./gradlew assembleDebug --no-daemon -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME" > "$RUNNER_TEMP/gradle.log" 2>&1; then
            tail -n 60 "$RUNNER_TEMP/gradle.log"
          else
            tail -n 100 "$RUNNER_TEMP/gradle.log"
            tail -n 35 "$RUNNER_TEMP/gradle.log" | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: VibeTun-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      # APK выкладывается только в артефакты прогона и релизы, в ветку не коммитится.
